name: CI

on:
  push:
    branches:
      - main
      - "kenn/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Scan tracked files for common secret formats
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit all dependencies
        run: npm run audit
