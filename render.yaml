services:
  - type: web
    name: mangaflux-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run db:migrate && npm run start --workspace=@mangaflux/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: WEB_ORIGIN
        value: https://manga.kenncode.me
      - key: APP_ORIGIN
        value: https://manga.kenncode.me
      - key: EMAIL_FROM
        value: MangaFlux <noreply@manga.kenncode.me>
      - key: MANGADEX_BASE_URL
        value: https://api.mangadex.org
