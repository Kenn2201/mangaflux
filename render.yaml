services:
  - type: web
    name: mangaflux-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start --workspace=@mangaflux/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 4000
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
